title: Acceso a credenciales (LSASS o SAM)
id: w11t-cred-dump
status: stable
description: Volcado de LSASS con comsvcs/procdump o copia de las colmenas SAM/SECURITY con reg save.
author: David
tags: [attack.credential_access, attack.t1003.001, attack.t1003.002]
logsource: {product: windows, category: process_creation}
detection:
  comsvcs:
    CommandLine|contains|all: ['comsvcs', 'minidump']
  procdump:
    CommandLine|contains|all: ['-ma', 'lsass']
  reg_save:
    Image|endswith: '\reg.exe'
    CommandLine|contains: ['save hklm\sam', 'save hklm\security', 'save hklm\system']
  condition: 1 of them
level: critical
