title: Clave Run apuntando a script o carpeta de usuario
title_en: Run key pointing to a script or user folder
id: w11t-reg-run-suspicious
status: stable
description: Se escribe en Run/RunOnce un valor que lanza un intérprete o un binario en una carpeta de usuario.
author: David
tags: [attack.persistence, attack.t1547.001]
logsource: {product: windows, category: registry_set}
detection:
  key:
    TargetObject|contains: ['\currentversion\run', '\currentversion\runonce']
  value:
    Details|contains: ['powershell', 'mshta', 'wscript', 'cscript', 'rundll32', '\appdata\', '\temp\', '\users\public\']
  condition: key and value
level: high
