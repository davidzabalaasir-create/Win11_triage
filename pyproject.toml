[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "win11-triage"
dynamic = ["version"]
description = "Triaje defensivo de Windows 11: persistencia, binarios sin firma y reputación en VirusTotal."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = ["rich>=13.7", "requests>=2.31", "python-dotenv>=1.0"]
keywords = ["dfir", "blue-team", "windows", "sysinternals", "virustotal", "incident-response"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
win11-triage = "win11_triage.cli:main"

[project.urls]
Repository = "https://github.com/davidzabalaasir-create/Win11_triage"

[tool.setuptools.dynamic]
version = { attr = "win11_triage.__version__" }

[tool.setuptools.packages.find]
include = ["win11_triage*"]

[tool.setuptools.package-data]
win11_triage = ["samples/*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]  # longitud: la gestiona ruff format; textos en español

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

[tool.pytest.ini_options]
testpaths = ["tests"]
