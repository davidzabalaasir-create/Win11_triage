name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publicar una release con este tag (p. ej. v2.0.0). Vacío = solo compilar."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev,yara]"
      - name: Tests (Windows)
        if: runner.os == 'Windows'
        run: pytest -q
      - name: Tests (Linux, con pantalla virtual para la GUI)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q xvfb
          xvfb-run -a pytest -q
      - name: Dry-run de humo
        run: win11-triage --dry-run --no-color --format both --config-dir .
      - name: Script remoto (WinRM) - sintaxis y ejecución local
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/win11_triage/remote/collect.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors; exit 1 }
          $json = powershell.exe -NoProfile -ExecutionPolicy Bypass -File win11_triage/remote/collect.ps1
          ($json -join "`n") | Set-Content -Encoding utf8 remote.json
          python -c "from pathlib import Path; from win11_triage import remote; d = remote.parse_output(Path('remote.json').read_text(encoding='utf-8-sig')); print(d['host'], len(d['processes']), 'procesos', len(d['autoruns']), 'autoruns'); assert d['processes'] and d['autoruns']"

  build-exe:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write  # solo para adjuntar los binarios a la release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar Inno Setup y WiX
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2
      - name: Certificado de firma "David"
        id: cert
        shell: pwsh
        env:
          PFX: ${{ secrets.WIN11_TRIAGE_PFX }}
          PFX_PASSWORD: ${{ secrets.WIN11_TRIAGE_PFX_PASSWORD }}
        run: |
          foreach ($f in "build_exe", "build_msix", "new_signing_cert", "sign_release") {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile("$PWD\scripts\$f.ps1", [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { $errors | Out-Host; throw "$f.ps1 tiene errores de sintaxis" }
          }
          if ($env:PFX) {
            # Certificado permanente del autor (secreto del repositorio).
            $path = Join-Path $env:RUNNER_TEMP "signing.pfx"
            [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:PFX))
            $pw = ConvertTo-SecureString $env:PFX_PASSWORD -AsPlainText -Force
            $c = Import-PfxCertificate -FilePath $path -CertStoreLocation Cert:\CurrentUser\My -Password $pw
            Remove-Item $path
          } else {
            # Sin secreto: certificado "David" temporal creado con el mismo script que usa el autor.
            Write-Host "Sin secreto WIN11_TRIAGE_PFX: se firma con un certificado David temporal."
            $c = ./scripts/new_signing_cert.ps1 -Name "David" -Years 1 -OutDir (Join-Path $env:RUNNER_TEMP "cert") -Quiet
            Remove-Item (Join-Path $env:RUNNER_TEMP "cert") -Recurse -Force
          }
          # De confianza solo en esta máquina de CI, para poder verificar las firmas.
          foreach ($store in "Root", "TrustedPublisher") {
            $s = New-Object System.Security.Cryptography.X509Certificates.X509Store($store, "LocalMachine")
            $s.Open("ReadWrite"); $s.Add($c); $s.Close()
          }
          Write-Host "Firmando como $($c.Subject) ($($c.Thumbprint))"
          "thumbprint=$($c.Thumbprint)" >> $env:GITHUB_OUTPUT
      - name: Compilar aplicación, instalador y MSI
        shell: pwsh
        run: ./scripts/build_exe.ps1 -CertThumbprint "${{ steps.cert.outputs.thumbprint }}"
      - name: Probar el instalador .exe (instalar, abrir, desinstalar)
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\win11-triage-setup-*.exe | Select-Object -First 1
          $dir = Join-Path $env:RUNNER_TEMP "w11t-app"
          $cfg = Join-Path $env:RUNNER_TEMP "w11t-cfg"
          Start-Process $setup.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/CURRENTUSER","/DIR=$dir","/TASKS=" -Wait
          if (-not (Test-Path "$dir\win11-triage-gui.exe")) { throw "La instalación no creó el ejecutable" }
          & "$dir\win11-triage.exe" --dry-run --no-color --no-report --config-dir $cfg
          if ($LASTEXITCODE) { throw "La versión de consola falló ($LASTEXITCODE)" }
          $p = Start-Process "$dir\win11-triage-gui.exe" -ArgumentList "--selftest","--config-dir",$cfg -Wait -PassThru
          Get-Content "$cfg\logs\win11-triage.log" -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "La interfaz no arrancó correctamente (código $($p.ExitCode))" }
          Start-Process "$dir\unins000.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES" -Wait
          for ($i = 0; $i -lt 30 -and (Test-Path "$dir\win11-triage-gui.exe"); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path "$dir\win11-triage-gui.exe") { throw "La desinstalación dejó ficheros" }
      - name: Probar el .msi (instalar, abrir, desinstalar)
        shell: pwsh
        run: |
          $msi = (Get-ChildItem dist\win11-triage-*.msi | Select-Object -First 1).FullName
          $log = Join-Path $env:RUNNER_TEMP "msi-install.log"
          $p = Start-Process msiexec.exe -ArgumentList "/i",$msi,"/qn","/norestart","/l*v",$log -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content $log -Tail 60; throw "msiexec /i falló ($($p.ExitCode))" }
          $dir = "$env:ProgramFiles\win11-triage"
          if (-not (Test-Path "$dir\win11-triage-gui.exe")) {
            Get-ChildItem "$env:ProgramFiles\win11-triage", "${env:ProgramFiles(x86)}\win11-triage" -Recurse -Depth 2 -ErrorAction SilentlyContinue | Select-Object -First 30 FullName
            Select-String -Path $log -Pattern "INSTALLFOLDER|InstallFiles|Note: 1:" | Select-Object -First 30
            throw "El MSI no instaló el ejecutable"
          }
          $cfg = Join-Path $env:RUNNER_TEMP "w11t-msi-cfg"
          $g = Start-Process "$dir\win11-triage-gui.exe" -ArgumentList "--selftest","--config-dir",$cfg -Wait -PassThru
          if ($g.ExitCode -ne 0) { Get-Content "$cfg\logs\win11-triage.log"; throw "La app instalada con MSI no arrancó" }
          foreach ($f in "$dir\win11-triage-gui.exe", "$dir\win11-triage.exe", $msi) {
            $sig = Get-AuthenticodeSignature $f
            Write-Host "Firma de $(Split-Path $f -Leaf): $($sig.SignerCertificate.Subject) ($($sig.Status))"
            if ($sig.Status -ne "Valid" -or $sig.SignerCertificate.Subject -notmatch "CN=David") { throw "Firma incorrecta en $f" }
          }
          $u = Start-Process msiexec.exe -ArgumentList "/x",$msi,"/qn","/norestart" -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "msiexec /x falló ($($u.ExitCode))" }
          if (Test-Path "$dir\win11-triage-gui.exe") { throw "La desinstalación del MSI dejó ficheros" }
      - name: Paquete MSIX (Microsoft Store)
        shell: pwsh
        run: |
          $c = Get-Item "Cert:\CurrentUser\My\${{ steps.cert.outputs.thumbprint }}"
          ./scripts/build_msix.ps1 -Publisher $c.Subject -CertThumbprint $c.Thumbprint
          $msix = Get-ChildItem dist\win11-triage-*.msix | Select-Object -First 1
          if ($msix.Length -lt 5MB) { throw "El MSIX ocupa demasiado poco: no contiene la aplicación" }
      - name: Probar el MSIX (instalar, abrir la CLI, desinstalar)
        continue-on-error: true  # depende del soporte de AppX del runner
        shell: pwsh
        run: |
          $msix = (Get-ChildItem dist\win11-triage-*.msix | Select-Object -First 1).FullName
          Add-AppxPackage -Path $msix
          $pkg = Get-AppxPackage -Name "David.win11-triage"
          if (-not $pkg) { throw "El paquete no quedó instalado" }
          & (Join-Path $pkg.InstallLocation "win11-triage.exe") --version
          Remove-AppxPackage -Package $pkg.PackageFullName
      - uses: actions/upload-artifact@v4
        with:
          name: win11-triage-windows
          path: |
            dist/win11-triage-setup-*.exe
            dist/win11-triage-*.msi
            dist/win11-triage-*.msix
            dist/win11-triage-portable-*.zip
      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: win11-triage ${{ inputs.release_tag || github.ref_name }}
          files: |
            dist/win11-triage-setup-*.exe
            dist/win11-triage-*.msi
            dist/win11-triage-*.msix
            dist/win11-triage-portable-*.zip
          generate_release_notes: true
      - name: Probar el script de firma de Certum (certificado de prueba autofirmado)
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD\scripts\sign_release.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | Out-Host; throw "sign_release.ps1 tiene errores de sintaxis" }
          # Certificado de prueba: de confianza solo en esta máquina de CI (nunca se publica).
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=win11-triage CI test" `
            -CertStoreLocation Cert:\CurrentUser\My -NotAfter (Get-Date).AddDays(1)
          foreach ($store in "Root", "TrustedPublisher") {
            $s = New-Object System.Security.Cryptography.X509Certificates.X509Store($store, "LocalMachine")
            $s.Open("ReadWrite"); $s.Add($cert); $s.Close()
          }
          $zip = Get-ChildItem dist\win11-triage-portable-*.zip | Select-Object -First 1
          Copy-Item $zip.FullName "$env:RUNNER_TEMP\$($zip.Name)"
          ./scripts/sign_release.ps1 -Portable "$env:RUNNER_TEMP\$($zip.Name)" -Thumbprint $cert.Thumbprint -OutDir "$env:RUNNER_TEMP\signed"
          Get-ChildItem "$env:RUNNER_TEMP\signed"
          # Los artefactos publicados siguen siendo los de dist\ (sin firma de prueba).
